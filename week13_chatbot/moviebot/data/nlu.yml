version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hello
      - hi
      - xin chào
      - chào bạn
      - hey
      - howdy
      - good morning
      - good afternoon
      - good evening
      - hi there
      - hello there
      - hey there
      - greetings
      - what's up
      - sup
      - chào
      - xin chào bot
      - hello bot
      - hi bot

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - tạm biệt
      - see you
      - see you later
      - good bye
      - take care
      - farewell
      - bye bye
      - later
      - ciao
      - adios
      - tạm biệt nhé
      - hẹn gặp lại
      - thôi bye
      - ok bye

