version: "3.9"

# ============================================================
# Movie Recommendation Chatbot — Docker Compose
#
# Services:
#   rasa          — Rasa NLU + Core server  (port 5005)
#   action_server — Rasa SDK action server  (port 5055)
#   trainer       — One-shot training job   (exits after training)
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose run --rm trainer    # re-train the model
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Rasa NLU + Core server
  # ----------------------------------------------------------
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviebot_rasa
    user: root                          # run as root to avoid permission issues
    ports:
      - "${RASA_PORT:-5005}:5005"
    volumes:
      - ./models:/app/models            # persist trained models
    command: >
      run
      --enable-api
      --cors "*"
      --debug
      --endpoints endpoints.yml
      --credentials credentials.yml
    depends_on:
      - action_server
    networks:
      - moviebot_net
    restart: unless-stopped

  # ----------------------------------------------------------
  # 2. Rasa SDK Action Server
  # ----------------------------------------------------------
  action_server:
    image: rasa/rasa-sdk:3.6.2
    container_name: moviebot_actions
    user: root                          # run as root to install packages
    ports:
      - "${ACTION_PORT:-5055}:5055"
    volumes:
      - ./actions:/app/actions          # custom action code
      - ./data_movies:/app/data_movies  # CSV dataset
    working_dir: /app
    # Install pandas + sklearn then start the action server
    entrypoint: >
      /bin/sh -c "
        pip install --no-cache-dir pandas==2.0.3 scikit-learn==1.3.2 &&
        python -m rasa_sdk --actions actions --port 5055
      "
    networks:
      - moviebot_net
    restart: unless-stopped

  # ----------------------------------------------------------
  # 3. One-shot trainer (run manually when you need to retrain)
  #    docker compose run --rm trainer
  # ----------------------------------------------------------
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviebot_trainer
    user: root                          # needs write access to config.yml
    volumes:
      - ./models:/app/models
    command: >
      train
      --domain domain.yml
      --data data/
      --out models/
      --fixed-model-name moviebot
    networks:
      - moviebot_net
    profiles:
      - train

networks:
  moviebot_net:
    driver: bridge
