version: "3.1"

# ── Rules ─────────────────────────────────────────────────────────────────────
# Rules là quy tắc cứng – luôn áp dụng khi điều kiện khớp.

rules:

  # ── Rule: Chào hỏi ────────────────────────────────────────────────────────────
  - rule: chao hoi
    steps:
      - intent: greet
      - action: utter_greet

  # ── Rule: Tạm biệt ───────────────────────────────────────────────────────────
  - rule: tam biet
    steps:
      - intent: goodbye
      - action: utter_goodbye

  # ── Rule: Hủy chuyến ─────────────────────────────────────────────────────────
  - rule: huy chuyen
    steps:
      - intent: cancel
      - action: utter_cancel

  # ── Rule: Trả lời khi bị hỏi có phải bot không ───────────────────────────────
  - rule: bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  # ── Rule: Fallback khi không hiểu ────────────────────────────────────────────
  - rule: fallback
    steps:
      - intent: nlu_fallback
      - action: utter_default
