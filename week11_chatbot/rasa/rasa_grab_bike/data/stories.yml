version: "3.1"

stories:

  # ── Đặt xe không có thông tin → hỏi từng bước ────────────────────────────────
  - story: dat xe khong co thong tin
    steps:
      - intent: book_ride
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - from_location: "bến xe"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - to_location: "sân bay"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - vehicle_type: "xe máy"
      - action: action_confirm_ride

  # ── Đặt xe có điểm đi → hỏi điểm đến → hỏi loại xe ─────────────────────────
  - story: dat xe co diem di
    steps:
      - intent: book_ride
        entities:
          - from_location: "Hải Châu"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - to_location: "Ngũ Hành Sơn"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - vehicle_type: "ô tô 4 chỗ"
      - action: action_confirm_ride

  # ── Đặt xe có điểm đi và đến → hỏi loại xe ──────────────────────────────────
  - story: dat xe co diem di va den
    steps:
      - intent: book_ride
        entities:
          - from_location: "Thanh Khê"
          - to_location: "Liên Chiểu"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - vehicle_type: "ô tô 7 chỗ"
      - action: action_confirm_ride

  # ── Đặt xe đầy đủ thông tin ngay ─────────────────────────────────────────────
  - story: dat xe day du
    steps:
      - intent: book_ride
        entities:
          - from_location: "Sơn Trà"
          - to_location: "VKU"
          - vehicle_type: "xe máy"
      - action: action_confirm_ride

  # ── Chào → đặt xe → tạm biệt ─────────────────────────────────────────────────
  - story: chao dat xe tam biet
    steps:
      - intent: greet
      - action: utter_greet
      - intent: book_ride
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - from_location: "VKU"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - to_location: "biển Mỹ Khê"
      - action: action_ask_missing_info
      - intent: inform
        entities:
          - vehicle_type: "xe máy"
      - action: action_confirm_ride
      - intent: goodbye
      - action: utter_goodbye

  # ── Hủy giữa chừng ───────────────────────────────────────────────────────────
  - story: huy chuyen di
    steps:
      - intent: book_ride
      - action: action_ask_missing_info
      - intent: cancel
      - action: utter_cancel

  # ── Chỉ chào hỏi ─────────────────────────────────────────────────────────────
  - story: chi chao hoi
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye
